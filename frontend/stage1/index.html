<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Card</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="app-container">
        <article class="todo-card" data-testid="test-todo-card">
            <!-- Header with title and status -->
            <div class="card-header">
                <div class="priority-indicator" data-testid="test-todo-priority-indicator" aria-hidden="true"></div>
                <div class="title-wrapper">
                    <h2 class="todo-title" data-testid="test-todo-title">Complete project documentation</h2>
                    <span class="priority-badge" data-testid="test-todo-priority" aria-label="High priority">
                        High
                    </span>
                </div>
                <div class="status-control-wrapper">
                    <select class="status-control" data-testid="test-todo-status-control" aria-label="Task status">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                    <span class="status-badge" data-testid="test-todo-status" aria-label="Status: Pending">
                        Pending
                    </span>
                </div>
            </div>

            <!-- Description section with expand/collapse -->
            <div class="description-section">
                <p class="todo-description" data-testid="test-todo-description">
                    Complete the comprehensive documentation for the new API endpoints and update the README with installation instructions.
                </p>
                <button class="expand-toggle" data-testid="test-todo-expand-toggle" aria-expanded="false" aria-label="Expand description" style="display: none;">
                    <span class="expand-text">Show more</span>
                </button>
            </div>

            <!-- Collapsible section -->
            <div class="collapsible-section" data-testid="test-todo-collapsible-section"></div>

            <!-- Due date and time remaining -->
            <div class="datetime-section">
                <time class="due-date" data-testid="test-todo-due-date" datetime="2026-03-01T18:00:00Z">
                    Due Mar 1, 2026
                </time>
                <div class="time-info">
                    <span class="overdue-indicator" data-testid="test-todo-overdue-indicator" style="display: none;">
                        Overdue
                    </span>
                    <span class="time-remaining" data-testid="test-todo-time-remaining" aria-live="polite">
                        Due in 11 days
                    </span>
                </div>
            </div>

            <!-- Tags -->
            <div class="tags-container" data-testid="test-todo-tags">
                <span class="tag" data-testid="test-todo-tag-work">work</span>
                <span class="tag" data-testid="test-todo-tag-urgent">urgent</span>
                <span class="tag" data-testid="test-todo-tag-design">design</span>
            </div>

            <!-- Checkbox -->
            <div class="checkbox-wrapper">
                <input 
                    type="checkbox" 
                    id="todo-complete-checkbox" 
                    class="todo-checkbox"
                    data-testid="test-todo-complete-toggle"
                    aria-describedby="checkbox-label"
                >
                <label for="todo-complete-checkbox" id="checkbox-label" class="checkbox-label">
                    Mark as complete
                </label>
            </div>

            <!-- Action buttons -->
            <div class="actions">
                <button class="btn btn-edit" data-testid="test-todo-edit-button" aria-label="Edit task">
                    Edit
                </button>
                <button class="btn btn-delete" data-testid="test-todo-delete-button" aria-label="Delete task">
                    Delete
                </button>
            </div>

            <!-- Edit Form (Hidden by default) -->
            <form class="edit-form-hidden" data-testid="test-todo-edit-form">
                <div class="edit-form-group">
                    <label for="edit-title" class="edit-label">Title</label>
                    <input 
                        type="text" 
                        id="edit-title" 
                        class="edit-input"
                        data-testid="test-todo-edit-title-input"
                        value="Complete project documentation"
                        required
                    >
                </div>

                <div class="edit-form-group">
                    <label for="edit-description" class="edit-label">Description</label>
                    <textarea 
                        id="edit-description" 
                        class="edit-textarea"
                        data-testid="test-todo-edit-description-input"
                        rows="4"
                    >Complete the comprehensive documentation for the new API endpoints and update the README with installation instructions.</textarea>
                </div>

                <div class="edit-form-group">
                    <label for="edit-priority" class="edit-label">Priority</label>
                    <select 
                        id="edit-priority" 
                        class="edit-select"
                        data-testid="test-todo-edit-priority-select"
                    >
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High" selected>High</option>
                    </select>
                </div>

                <div class="edit-form-group">
                    <label for="edit-due-date" class="edit-label">Due Date</label>
                    <input 
                        type="date" 
                        id="edit-due-date" 
                        class="edit-input"
                        data-testid="test-todo-edit-due-date-input"
                        value="2026-03-01"
                        required
                    >
                </div>

                <div class="edit-form-actions">
                    <button type="submit" class="btn btn-save" data-testid="test-todo-save-button" aria-label="Save changes">
                        Save
                    </button>
                    <button type="button" class="btn btn-cancel" data-testid="test-todo-cancel-button" aria-label="Cancel editing">
                        Cancel
                    </button>
                </div>
            </form>
        </article>
    </main>

    <script src="index.js"></script>
</body>
</html>
