<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Card</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="app-container">
        <article class="todo-card" data-testid="test-todo-card">
            <!-- Header with title and status -->
            <div class="card-header">
                <div class="title-wrapper">
                    <h2 class="todo-title" data-testid="test-todo-title">Complete project documentation</h2>
                    <span class="priority-badge" data-testid="test-todo-priority" aria-label="High priority">
                        High
                    </span>
                </div>
                <span class="status-badge" data-testid="test-todo-status" aria-label="Status: Pending">
                    Pending
                </span>
            </div>

            <!-- Description -->
            <p class="todo-description" data-testid="test-todo-description">
                Complete the comprehensive documentation for the new API endpoints and update the README with installation instructions.
            </p>

            <!-- Due date and time remaining -->
            <div class="datetime-section">
                <time class="due-date" data-testid="test-todo-due-date" datetime="2026-03-01T18:00:00Z">
                    Due Mar 1, 2026
                </time>
                <span class="time-remaining" data-testid="test-todo-time-remaining" aria-live="polite">
                    Due in 11 days
                </span>
            </div>

            <!-- Tags -->
            <div class="tags-container" data-testid="test-todo-tags">
                <span class="tag" data-testid="test-todo-tag-work">work</span>
                <span class="tag" data-testid="test-todo-tag-urgent">urgent</span>
                <span class="tag" data-testid="test-todo-tag-design">design</span>
            </div>

            <!-- Checkbox -->
            <div class="checkbox-wrapper">
                <input 
                    type="checkbox" 
                    id="todo-complete-checkbox" 
                    class="todo-checkbox"
                    data-testid="test-todo-complete-toggle"
                    aria-describedby="checkbox-label"
                >
                <label for="todo-complete-checkbox" id="checkbox-label" class="checkbox-label">
                    Mark as complete
                </label>
            </div>

            <!-- Action buttons -->
            <div class="actions">
                <button class="btn btn-edit" data-testid="test-todo-edit-button" aria-label="Edit task">
                    Edit
                </button>
                <button class="btn btn-delete" data-testid="test-todo-delete-button" aria-label="Delete task">
                    Delete
                </button>
            </div>
        </article>
    </main>

    <script src="index.js"></script>
</body>
</html>
